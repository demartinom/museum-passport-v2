name: Nightly pipeline

on:
    workflow_dispatch:
jobs:
    pipeline:
        runs-on: ubuntu-latest
        steps:
            - name: checkout main repo
              uses: actions/checkout@v4
            - name: checkout data repo
              uses: actions/checkout@v4
              with:
                  repository: demartinom/museum-passport-data
                  path: data
                  token: ${{secrets.DATA_REPO_TOKEN}}
            - name: run commands
              run: |
                  ls data/raw/met | head
                  cat data/raw/met/last_run.txt
